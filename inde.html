<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Smart Expense Tracker Pro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>💰 Smart Expense Tracker Pro</h1>

            <button id="themeBtn">
                🌙 Dark Mode
            </button>

        </header>

        <div class="dashboard">

            <div class="card income-card">

                <h3>Total Income</h3>

                <p id="income">
                    ₹0
                </p>

            </div>

            <div class="card expense-card">

                <h3>Total Expense</h3>

                <p id="expense">
                    ₹0
                </p>

            </div>

            <div class="card balance-card">

                <h3>Balance</h3>

                <p id="balance">
                    ₹0
                </p>

            </div>

        </div>

        <div class="controls">

            <input
                type="text"
                id="search"
                placeholder="🔍 Search transaction">

            <select id="filter">

                <option value="All">
                    All Transactions
                </option>

                <option value="Income">
                    Income
                </option>

                <option value="Expense">
                    Expense
                </option>

            </select>

        </div>

        <div class="form-section">

            <h2>Add Transaction</h2>

            <input
                type="text"
                id="title"
                placeholder="Transaction Title">

            <input
                type="number"
                id="amount"
                placeholder="Amount">

            <select id="type">

                <option value="Income">
                    Income
                </option>

                <option value="Expense">
                    Expense
                </option>

            </select>

            <button id="addBtn">
                Add Transaction
            </button>

        </div>

        <div class="transaction-section">

            <h2>Recent Transactions</h2>

            <ul id="transactionList">

            </ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
